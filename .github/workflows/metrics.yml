name: LeetCode Metrics
on:
  # Update automatically every day at midnight
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: leetcode-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Disable base GitHub stats to only show LeetCode (keeps it clean)
          base: ""
          
          # LeetCode Plugin Configuration
          plugin_leetcode: yes
          plugin_leetcode_user: aleksandr-sh-dev
          plugin_leetcode_sections: solved, skills, recent